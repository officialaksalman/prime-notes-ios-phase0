[versions]
# NOTE: version keys must NOT be named the same as any [plugins] alias.
# The CI matrix rewrites these lines with sed, and a key that also names a plugin
# alias matches two lines — which silently overwrites the plugin declaration.
#
# Overridden per CI matrix leg: the two Compose Multiplatform lines that have a usable
# iOS material3 (see the note below). Kotlin stays at 2.2.20, which CMP recommends for iOS.
kotlinVersion = "2.2.20"
kspVersion = "2.2.20-2.0.4"
composeVersion = "1.12.1"
agpVersion = "9.4.0"

# IMPORTANT, measured from Maven Central: org.jetbrains.compose.material3:material3
# does NOT follow the Compose Multiplatform version line, and its iOS artifacts only begin
# at 1.11.0-alpha01 — there is no iOS material3 for the 1.9 or 1.10 lines at all.
# 1.12.0-alpha03 publishes an iossimulatorarm64 module whose klib the Kotlin resolver
# cannot find, so it is avoided here too.
composeMaterial3Version = "1.13.0-alpha01"

# Room KMP. androidx.room:2.8.5 (what production uses) CANNOT target iOS: it depends on
# androidx.sqlite:sqlite-framework, which publishes no iOS artifact at all (404 on
# sqlite-framework-iossimulatorarm64). The KMP-capable line is androidx.room3 — currently alpha.
roomVersion = "3.1.0-alpha01"
sqliteVersion = "2.7.1"

ktorVersion = "3.1.2"
supabaseVersion = "3.1.4"
coroutinesVersion = "1.11.0"
serializationVersion = "1.7.3"

[libraries]
# Compose Multiplatform artifacts declared DIRECTLY: CMP 1.10+ deprecates the
# `compose.runtime` / `compose.material3` DSL accessors at error level.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeVersion" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeVersion" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeVersion" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3Version" }

room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "roomVersion" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "roomVersion" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqliteVersion" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktorVersion" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktorVersion" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktorVersion" }

# Explicit versions rather than the Supabase BOM: `platform(...)` is itself deprecated
# in this toolchain and was one of the five build-script compile errors.
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt", version.ref = "supabaseVersion" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt", version.ref = "supabaseVersion" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutinesVersion" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesVersion" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationVersion" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlinVersion" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinVersion" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinVersion" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeVersion" }
ksp = { id = "com.google.devtools.ksp", version.ref = "kspVersion" }
room = { id = "androidx.room3", version.ref = "roomVersion" }

# AGP 9+ : com.android.library is NOT compatible with the Kotlin Multiplatform plugin,
# so the Android target comes from this dedicated plugin instead.
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agpVersion" }
