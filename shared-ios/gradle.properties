org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Copied from the production file. AGP 9 disallows the kotlin.sourceSets DSL because Kotlin
# support is built in; the module does not use it today, and dropping the line here would be a
# difference between this build and the real one, which is the thing worth avoiding.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
