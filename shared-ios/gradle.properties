org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 disallows the kotlin.sourceSets DSL because Kotlin support is built in. The KSP Gradle
# plugin registers its generated source directories that way, and without this AGP fails
# configuration of Room's annotation processing with:
#   "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin."
# This is the escape hatch AGP's own error message prescribes.
#
# NOTE: added against KSP 2.2.10-2.0.2. The project now uses KSP 2.3.12 and whether this line is
# still needed has NOT been tested — it should be, and dropped if the newer KSP registers its
# sources through the variant Sources API.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
