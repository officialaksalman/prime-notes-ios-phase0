# Phase 0 — iOS / KMP verification (sandbox only)
#
# Runs the macOS-only Phase 0 spikes. This repository is a dedicated sandbox: it contains
# no production Prime Notes code and never touches the production repository.
#
# Why it publishes its own results: no GitHub token or CLI is available to the agent
# driving these runs, so a run cannot be inspected from outside. Each run commits a
# RESULTS.md back to the repository, which is then read over git.
#
# Trigger: a push to main (or manual dispatch). Commits made by GITHUB_TOKEN do not
# re-trigger workflows, so the results commit cannot cause a loop.
#
# FAILURE DETECTION: every gradlew step sets `pipefail`. Without it a
# `gradlew ... | tee log` pipeline reports tee's exit code (0) and a failed build is
# recorded as a success — that bug already produced one false green run.
#
# DECOUPLING: the two spikes are separate modules and separate steps, so a Room failure
# (currently blocked by an upstream klib problem) cannot hide the Compose Multiplatform
# and Supabase results.

name: Phase 0 — iOS/KMP verification

on:
  push:
    branches: [main]
    # Only when the spikes themselves change. Phase 0 is finished, and without this filter every
    # push to this repository — including one that adds an unrelated workflow — re-ran the whole
    # three-leg macOS matrix.
    paths:
      - 'phase0-ios-verification/**'
      - '.github/workflows/phase0-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify (${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Kotlin is the variable under test: room3 3.1.0-alpha01 is built against Kotlin
        # 2.1.20, and whether a newer Kotlin Gradle plugin can read its iOS klib metadata
        # is unknown. KSP is pinned per leg from the published KSP version list.
        # Everything in `include` only: mixing `include` with other axes would add an extra
        # combination that has none of the include keys set.
        include:
          - kotlin: "2.2.20"
            ksp: "2.2.20-2.0.4"
            compose: "1.12.1"
            material3: "1.13.0-alpha01"
            label: kotlin-2.2.20
          - kotlin: "2.3.20"
            ksp: "2.3.12"
            compose: "1.12.1"
            material3: "1.13.0-alpha01"
            label: kotlin-2.3.20
          - kotlin: "2.4.20"
            ksp: "2.3.12"
            compose: "1.12.1"
            material3: "1.13.0-alpha01"
            label: kotlin-2.4.20

    steps:
      - uses: actions/checkout@v4

      # A copy of gradlew made from Windows loses its executable bit; git then records
      # mode 100644 and every invocation dies with "Permission denied".
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Kotlin/Native 2.3.20+ expects a newer Xcode than this image's default. Without a
      # matching toolchain the test executable fails to link with:
      #   ld: library 'swiftCompatibility51' not found
      #   ld: search path '/Applications/Xcode_26.4.app/.../usr/lib/swift/iphonesimulator' not found
      - name: Select the newest available Xcode
        run: |
          echo "--- Xcode installations present ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"
          echo "current DEVELOPER_DIR=${DEVELOPER_DIR:-unset}"
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST" || true
            echo "DEVELOPER_DIR=$NEWEST" >> "$GITHUB_ENV"
          fi
          echo "--- selected ---"
          xcode-select -p
          xcodebuild -version

      # Kotlin/Native 2.3.20+ hardcodes a Swift runtime search path for a specific Xcode
      # that this image does not install (it has 26.3, the toolchain looks for 26.4), so the
      # iOS test executable fails to link with:
      #   ld: library 'swiftCompatibility51' not found
      # Satisfy the expected path with a symlink to the Xcode that IS present. CI-only.
      - name: Satisfy the Kotlin/Native expected Xcode path
        run: |
          if [ ! -e /Applications/Xcode_26.4.app ]; then
            TARGET=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            if [ -n "$TARGET" ]; then
              sudo ln -sfn "$TARGET" /Applications/Xcode_26.4.app || true
              echo "symlinked /Applications/Xcode_26.4.app -> $TARGET"
            fi
          fi
          ls -ld /Applications/Xcode*.app 2>/dev/null || true
          ls /Applications/Xcode_26.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphonesimulator/ 2>/dev/null | grep -i compatibility || echo "(no swiftCompatibility* found)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply matrix versions to the version catalog
        run: |
          set -o pipefail
          f=phase0-ios-verification/gradle/libs.versions.toml
          # Anchor on keys that CANNOT collide with a [plugins] alias: a pattern like
          # "^ksp = " matches both the [versions] entry and the [plugins] declaration,
          # and rewrites the plugin declaration into a bare string.
          sed -i '' -E "s/^kotlinVersion = .*/kotlinVersion = \"${{ matrix.kotlin }}\"/" "$f"
          sed -i '' -E "s/^kspVersion = .*/kspVersion = \"${{ matrix.ksp }}\"/" "$f"
          sed -i '' -E "s/^composeVersion = .*/composeVersion = \"${{ matrix.compose }}\"/" "$f"
          sed -i '' -E "s/^composeMaterial3Version = .*/composeMaterial3Version = \"${{ matrix.material3 }}\"/" "$f"
          echo "--- resolved catalog versions ---"
          grep -E '^(kotlinVersion|kspVersion|composeVersion|composeMaterial3Version|roomVersion|sqliteVersion|ktorVersion|supabaseVersion) =' "$f" || true
          echo "--- plugin declarations must still be intact ---"
          grep -E '^ksp = |^room = |^composeMultiplatform = ' "$f" || true

      - name: Toolchain report
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p logs
          {
            echo "### runner";                 sw_vers
            echo "### xcode";                  xcodebuild -version
            echo "### java";                   java -version 2>&1
            echo "### gradle";                 ./gradlew -p phase0-ios-verification --version
            echo "### simulators (available)"; xcrun simctl list devices available | head -25
          } 2>&1 | tee logs/00-toolchain.txt

      # ------------------------------------------------------------------
      # Spike B + C: Compose Multiplatform and Supabase. No Room, no KSP, so these
      # results are independent of the Room blocker.
      # ------------------------------------------------------------------
      - name: "Spike C — Supabase/Darwin + Compose on the iOS simulator"
        id: uicloudtest
        continue-on-error: true
        env:
          # `xcrun simctl spawn` forwards to the simulated process ONLY the variables the host
          # names with a SIMCTL_CHILD_ prefix. That is why the first credential-free run
          # printed "no URL/key supplied" even though these were set. Both spellings are
          # provided: the plain names for any host-side use, the prefixed ones for the child.
          PHASE0_SUPABASE_URL: https://ikmnfqzsvdcfuxizevti.supabase.co
          SIMCTL_CHILD_PHASE0_SUPABASE_URL: https://ikmnfqzsvdcfuxizevti.supabase.co
          # Non-secret by design: this ships inside every Android APK, and RLS — not the key —
          # is the boundary.
          PHASE0_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrbW5mcXpzdmRjZnV4aXpldnRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNzc0MjEsImV4cCI6MjEwNTY1MzQyMX0.YE-uy6nA1SJ87tcX7CDQS_r9tyD4pbFEDyBeZ7BX1NA
          SIMCTL_CHILD_PHASE0_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrbW5mcXpzdmRjZnV4aXpldnRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNzc0MjEsImV4cCI6MjEwNTY1MzQyMX0.YE-uy6nA1SJ87tcX7CDQS_r9tyD4pbFEDyBeZ7BX1NA
          # Still secrets: needed only for the full sign-in / session-restore flow, and must
          # never be committed. Absent -> that test reports SKIPPED rather than pretending.
          PHASE0_TEST_EMAIL: ${{ secrets.PHASE0_TEST_EMAIL }}
          SIMCTL_CHILD_PHASE0_TEST_EMAIL: ${{ secrets.PHASE0_TEST_EMAIL }}
          PHASE0_TEST_PASSWORD: ${{ secrets.PHASE0_TEST_PASSWORD }}
          SIMCTL_CHILD_PHASE0_TEST_PASSWORD: ${{ secrets.PHASE0_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p logs
          ./gradlew -p phase0-ios-verification :spikeUiCloud:iosSimulatorArm64Test \
            --stacktrace --info 2>&1 | tee logs/10-spikeC-uicloud-tests.txt

      - name: "Spike B — link the Compose Multiplatform iOS framework"
        id: uicloudframework
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p logs
          ./gradlew -p phase0-ios-verification :spikeUiCloud:linkDebugFrameworkIosSimulatorArm64 \
            --stacktrace 2>&1 | tee logs/20-spikeB-ios-framework.txt

      # ------------------------------------------------------------------
      # Spike A: Room KMP + FTS4 + migration. Separate step and module.
      # ------------------------------------------------------------------
      - name: "Spike A — Room KMP / FTS4 on the iOS simulator"
        id: roomtest
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p logs
          ./gradlew -p phase0-ios-verification :spikeRoom:iosSimulatorArm64Test \
            --stacktrace --info 2>&1 | tee logs/30-spikeA-room-tests.txt

      - name: Resolved dependency report
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p logs
          ./gradlew -p phase0-ios-verification dependencies 2>&1 | tee logs/40-dependencies.txt || true

      - name: Record verdict for this matrix leg
        if: always()
        run: |
          mkdir -p logs
          {
            echo "kotlin=${{ matrix.kotlin }}"
            echo "ksp=${{ matrix.ksp }}"
            echo "compose=${{ matrix.compose }}"
            echo "material3=${{ matrix.material3 }}"
            echo "spikeA_room=${{ steps.roomtest.outcome }}"
            echo "spikeB_cmp_ios_framework=${{ steps.uicloudframework.outcome }}"
            echo "spikeC_supabase_ios=${{ steps.uicloudtest.outcome }}"
            echo "job_status=${{ job.status }}"
          } > logs/99-verdict.txt
          cat logs/99-verdict.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-logs-${{ matrix.label }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: publish results
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all spike logs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build RESULTS.md
        run: |
          {
            echo "# Phase 0 — verified results"
            echo
            echo "Generated by run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) on \`macos-15\`."
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo
          } > RESULTS.md

          shopt -s nullglob
          for d in artifacts/*/; do
            name=$(basename "$d")
            echo "## leg: $name" >> RESULTS.md
            echo '```' >> RESULTS.md
            [ -f "$d/99-verdict.txt" ] && cat "$d/99-verdict.txt" >> RESULTS.md
            echo '```' >> RESULTS.md
            for f in "$d"/*.txt; do
              [ "$(basename "$f")" = "99-verdict.txt" ] && continue
              [ "$(basename "$f")" = "40-dependencies.txt" ] && continue
              echo "### $(basename "$f")" >> RESULTS.md
              echo '```' >> RESULTS.md
              tail -c 30000 "$f" >> RESULTS.md
              echo '```' >> RESULTS.md
            done
          done

      - name: Commit results
        run: |
          git config user.name "phase0-bot"
          git config user.email "phase0-bot@users.noreply.github.com"
          git add RESULTS.md
          if git diff --cached --quiet; then
            echo "no changes to RESULTS.md"
          else
            git commit -m "Phase 0 results for ${{ github.sha }} [skip ci]"
            git push
          fi
